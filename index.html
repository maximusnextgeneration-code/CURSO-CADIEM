<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c2e4e">
<meta name="color-scheme" content="light">
<title>Evaluaciones Curso Cadiem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0c2e4e; --navy-2:#153f66; --celeste:#4986c4; --celeste-soft:#e6eff8;
  --tostado:#c99a5f; --ink:#1b2633; --muted:#5d6b7a; --line:#dde3ea; --bg:#f4f6f9; --card:#ffffff;
  --ok:#1f7a4d; --ok-soft:#e5f4ec; --bad:#b3372f; --bad-soft:#fbeae8;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* Header */
header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 0 14px;position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;gap:12px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--celeste);display:grid;place-items:center;font-weight:800;font-size:15px;flex-shrink:0}
.brand-txt{min-width:0}
.brand-txt small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.brand-txt strong{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-btn{margin-left:auto;font-size:13px;font-weight:600;color:#fff;opacity:.85;padding:8px 10px;border-radius:8px}
.home-btn:hover{background:rgba(255,255,255,.1)}
.progress{height:4px;background:rgba(255,255,255,.15);margin-top:12px}
.progress i{display:block;height:100%;background:var(--celeste);width:0;transition:width .35s ease}

main{padding:22px 0 40px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--celeste)}
h1{font-size:26px;line-height:1.2;font-weight:800;color:var(--navy);margin:6px 0 10px}
h2{font-size:19px;line-height:1.35;font-weight:700;color:var(--navy)}
.lead{color:var(--muted);font-size:15px}

/* Home */
.mods{display:grid;gap:12px;margin-top:22px}
.mod{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:left;width:100%;transition:border-color .15s, transform .15s}
.mod:hover{border-color:var(--celeste)}
.mod:active{transform:scale(.99)}
.mod .num{width:46px;height:46px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex-shrink:0}
.mod .t{font-weight:700;color:var(--navy);font-size:16px}
.mod .s{font-size:13px;color:var(--muted)}
.mod .done{margin-left:auto;font-size:12px;font-weight:700;color:var(--ok);background:var(--ok-soft);padding:4px 9px;border-radius:999px;white-space:nowrap}

/* Intro */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.field{margin-top:18px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.field input:focus{outline:2px solid var(--celeste);outline-offset:1px;border-color:transparent}
.facts{display:flex;gap:18px;margin-top:16px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.facts b{color:var(--navy)}

.btn{display:block;width:100%;margin-top:20px;padding:15px 18px;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font-size:16px;text-align:center;transition:background .15s,opacity .15s}
.btn:hover{background:var(--navy-2)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
.btn.ghost:hover{background:var(--celeste-soft)}

/* Question */
.qhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.qcount{font-size:13px;font-weight:700;color:var(--muted)}
.qscore{font-size:13px;color:var(--muted)}
.qtext{font-size:18px;line-height:1.45;font-weight:600;color:var(--ink);margin-bottom:18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;font-size:15px;line-height:1.45;transition:border-color .12s, background .12s}
.opt .L{flex-shrink:0;width:28px;height:28px;border-radius:8px;background:var(--celeste-soft);color:var(--navy);font-weight:800;font-size:14px;display:grid;place-items:center}
.opt:hover:not([disabled]){border-color:var(--celeste)}
.opt.sel{border-color:var(--navy);background:var(--celeste-soft)}
.opt.sel .L{background:var(--navy);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:14.5px;border-left:4px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.no{background:var(--bad-soft);border-color:var(--bad)}
.fb strong{display:block;margin-bottom:4px;font-size:15px}
.fb.ok strong{color:var(--ok)} .fb.no strong{color:var(--bad)}

/* Result */
.score{display:flex;align-items:center;gap:20px;margin:6px 0 4px}
.ring{--p:0;width:112px;height:112px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  background:conic-gradient(var(--celeste) calc(var(--p)*1%), var(--line) 0)}
.ring span{width:88px;height:88px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:28px;color:var(--navy)}
.stamp{font-size:13px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.review{display:grid;gap:10px;margin-top:22px}
.rv{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px}
.rv .h{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.rv .dot{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;margin-top:1px}
.rv .dot.ok{background:var(--ok)} .rv .dot.no{background:var(--bad)}
.rv p{color:var(--muted);margin-top:6px;padding-left:32px}
.rv p b{color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.row .btn{margin-top:0}
footer{text-align:center;font-size:12px;color:var(--muted);padding:0 16px calc(24px + env(safe-area-inset-bottom))}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (min-width:700px){ h1{font-size:30px} .qtext{font-size:19px} main{padding-top:34px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand-mark">C</div>
    <div class="brand-txt"><small>Curso Cadiem 2026</small><strong id="hdrTitle">Evaluaciones</strong></div>
    <button class="home-btn" id="homeBtn" hidden>Temas</button>
  </div>
  <div class="progress" id="prog" hidden><i id="progBar"></i></div>
</header>
<main><div class="wrap" id="app"></div></main>
<footer>Certificación Profesional en Mercados Financieros · LATAM ConsultUs</footer>

<script>
const MODULES = {
  m1: {
    num: "1", when: "Viernes 2/10 · 9:30 h", title: "Economía & Mercados",
    questions: [
      {
        q: "Según la ecuación PIB = C + I + G + X − M, ¿qué efecto tiene sobre el PIB que un país registre déficit comercial?",
        o: ["Suma al PIB, porque las importaciones amplían la oferta de bienes",
            "Resta al PIB, porque las exportaciones netas (X − M) son negativas",
            "No tiene efecto, porque el comercio exterior no forma parte del PIB",
            "Aumenta el gasto público (G) en la misma magnitud"],
        a: 1,
        e: "Hay déficit comercial cuando las importaciones superan a las exportaciones. Entonces X − M es negativo y ese componente resta al PIB."
      },
      {
        q: "El rendimiento del bono del Tesoro de EE.UU. a 10 años se usa como tasa libre de riesgo. Si sube de forma sostenida, ¿qué es lo esperable para la valuación de los activos de riesgo?",
        o: ["Que suba, porque los flujos futuros se descuentan a una tasa menor",
            "Que no cambie, porque la tasa libre de riesgo solo afecta a los bonos",
            "Que baje, porque los flujos futuros se descuentan a una tasa mayor y el costo de oportunidad aumenta",
            "Que suba solamente en las empresas con mucha deuda"],
        a: 2,
        e: "La tasa libre de riesgo es la base para descontar flujos futuros. Si sube, baja el valor presente de esos flujos y los activos sin riesgo compiten mejor con las acciones y los bonos corporativos."
      },
      {
        q: "El 16/09/2026 la Fed subió la tasa 25 pb, a 3,75–4,00%, su primera suba desde julio de 2023. ¿Cuál es el objetivo principal de una suba de tasas?",
        o: ["Estimular el crédito y el consumo para acelerar el crecimiento",
            "Encarecer el financiamiento para moderar la demanda y contener una inflación que sigue elevada",
            "Debilitar el dólar para favorecer las exportaciones",
            "Financiar el déficit fiscal con una tasa más baja"],
        a: 1,
        e: "Un banco central sube la tasa para encarecer el crédito, enfriar la demanda y llevar la inflación hacia su objetivo. En su comunicado, la Fed sostuvo que la inflación seguía elevada."
      },
      {
        q: "En 2026 volvió la prima por plazo y la curva de tasas se empinó, con el Tesoro a 30 años en máximos. ¿Cuál de estos factores NO empuja a subir la prima por plazo?",
        o: ["Un déficit fiscal alto, que obliga a emitir más deuda",
            "El retiro de compradores poco sensibles al precio, como los bancos centrales",
            "Una mayor incertidumbre sobre la inflación futura",
            "Un banco central que compra masivamente bonos largos (flexibilización cuantitativa)"],
        a: 3,
        e: "Las compras masivas de bonos largos por parte del banco central aumentan la demanda de esos bonos y comprimen la prima por plazo. Los otros tres factores la hacen subir."
      },
      {
        q: "¿Qué miden los índices MOVE y VIX?",
        o: ["La volatilidad implícita en las opciones sobre bonos del Tesoro (MOVE) y sobre el S&P 500 (VIX)",
            "La volatilidad histórica del dólar (MOVE) y del oro (VIX)",
            "El volumen operado en los mercados de bonos (MOVE) y de acciones (VIX)",
            "El spread de crédito high yield (MOVE) y la tasa de la Fed esperada (VIX)"],
        a: 0,
        e: "Ambos miden la volatilidad implícita, es decir, la que el mercado espera para adelante según los precios de las opciones. El MOVE lo hace para los bonos del Tesoro y el VIX para el S&P 500. Suelen dispararse en momentos de estrés."
      }
    ]
  },
  m3: {
    num: "2", when: "Viernes 2/10 · 10:30 h", title: "Bonos",
    questions: [
      {
        q: "Una empresa quiebra. ¿Quién tiene prioridad de cobro sobre sus activos?",
        o: ["Los accionistas ordinarios, porque son los dueños",
            "Los tenedores de deuda senior asegurada, luego la senior no asegurada y la subordinada; los accionistas cobran últimos",
            "Los tenedores de acciones preferidas, antes que cualquier bonista",
            "Todos cobran a prorrata, sin importar el instrumento"],
        a: 1,
        e: "El bonista es un acreedor: cobra antes que el accionista. Entre los bonistas, cobran primero los asegurados senior, después los no asegurados y al final la deuda subordinada. Las acciones preferidas y ordinarias quedan al final."
      },
      {
        q: "Tenés un bono a tasa fija y las tasas de mercado suben. ¿Qué pasa con su precio?",
        o: ["Sube, porque ahora el bono rinde más",
            "Baja: precio y tasa se mueven en sentido inverso, porque los flujos se descuentan a una tasa mayor",
            "No cambia, porque el cupón es fijo",
            "Sube solo si el bono es de grado de inversión"],
        a: 1,
        e: "El precio es el valor presente de cupones y nominal. Si sube la tasa, el denominador es mayor y el precio cae. Es lo que se ve en el curso con el ETF TLT frente al rendimiento del Tesoro a 20 años: tasa ↑ → precio ↓."
      },
      {
        q: "Según los índices ICE que se ven en el caso Pemex, un bono BB rinde más que un BBB del mismo plazo. ¿Por qué?",
        o: ["Porque los bonos BB tienen mayor duración",
            "Porque BB ya es high yield (especulativo): el mercado exige un spread mayor por el mayor riesgo de impago",
            "Porque los bonos BB los emiten solo gobiernos",
            "Porque el rating no influye en el rendimiento"],
        a: 1,
        e: "El grado de inversión llega hasta BBB. Desde BB (Ba en Moody's) hacia abajo, los bonos son especulativos y pagan un spread mayor sobre el Tesoro para compensar el riesgo crediticio. En la tabla del caso, el OAS de BB es ~156 pb, contra ~95 pb de BBB."
      },
      {
        q: "Un bono es callable: el emisor puede rescatarlo antes del vencimiento. ¿Qué rendimiento conviene mirar para no sobreestimar lo que vas a ganar?",
        o: ["El cupón del bono",
            "El Yield to Worst (YTW): el menor entre el rendimiento al vencimiento (YTM) y el rendimiento a la fecha de call (YTC)",
            "Siempre el YTM, porque el call nunca se ejerce",
            "El spread bid/ask"],
        a: 1,
        e: "El emisor ejerce el call cuando le conviene, por ejemplo si las tasas bajaron, y eso perjudica al inversor. El YTW toma el peor escenario entre el vencimiento y las fechas de call."
      },
      {
        q: "En el caso práctico, Pemex tiene una deuda neta / EBITDA de ~2,1x y Petrobras de ~0,8x (2T26). ¿Qué implica para un inversor en bonos?",
        o: ["Que Pemex es menos riesgosa porque tiene más deuda",
            "Que Pemex está mucho más apalancada, así que su riesgo crediticio es mayor y el mercado le exige más rendimiento",
            "Que las dos tienen el mismo riesgo porque son petroleras",
            "Que el indicador solo sirve para analizar acciones"],
        a: 1,
        e: "Deuda neta / EBITDA mide cuántos años de generación operativa harían falta para pagar la deuda. Cuanto más alto, más apalancada y riesgosa es la empresa. Por eso, entre otros factores, los bonos de Pemex rinden más que los de sus comparables."
      }
    ]
  },
  m4: {
    num: "3", when: "Viernes 2/10 · 14:30 h", title: "Fondos Mutuos",
    questions: [
      {
        q: "¿Qué representa el NAV (Net Asset Value) de un fondo mutuo?",
        o: ["El precio al que cotiza en bolsa durante el día",
            "El valor liquidativo de una participación: el patrimonio neto del fondo dividido por las cuotapartes",
            "La rentabilidad mínima garantizada del fondo",
            "El monto mínimo de inversión"],
        a: 1,
        e: "El NAV es el valor de cada cuotaparte: activos menos pasivos, dividido por la cantidad de participaciones. Las suscripciones y los rescates se hacen a ese valor, que el fondo calcula normalmente una vez por día."
      },
      {
        q: "Un cliente necesita un ingreso periódico. ¿Qué es cierto sobre la clase distributiva de un fondo?",
        o: ["Todos los fondos tienen clase distributiva y pagan un porcentaje fijo",
            "Reparte periódicamente los resultados; el porcentaje no es fijo y debe estar alineado con lo que invierte el fondo",
            "Garantiza el capital invertido",
            "Reinvierte automáticamente los dividendos dentro del fondo"],
        a: 1,
        e: "La clase distributiva paga los resultados (el detalle está en el factsheet). No todos los fondos la tienen, el monto no es fijo y debe ser coherente con la cartera. La que reinvierte los resultados es la clase acumulativa (Acc)."
      },
      {
        q: "Un fondo obtuvo 8% bruto en el año y tiene un Total Expense Ratio (TER) de 1,5%. ¿Cuál es aproximadamente el rendimiento del inversor?",
        o: ["8%, porque los costos los absorbe la gestora",
            "6,5%, porque el TER se descuenta del patrimonio del fondo",
            "9,5%",
            "1,5%"],
        a: 1,
        e: "El TER reúne los costos recurrentes (management fee y otros gastos) y se descuenta del NAV. El inversor recibe ≈ 8% − 1,5% = 6,5%. Por eso el costo es uno de los puntos clave para evaluar un fondo."
      },
      {
        q: "La normativa UCITS limita, en general, al 10% la inversión en valores de un solo emisor. ¿Qué busca con esa regla?",
        o: ["Garantizar un rendimiento mínimo",
            "Proteger al inversor mediante la diversificación, para que un único emisor no pueda afectar demasiado al fondo",
            "Que los fondos solo inviertan en Europa",
            "Eliminar los costos de gestión"],
        a: 1,
        e: "UCITS es el marco regulatorio europeo, con reglas de diversificación, liquidez, transparencia y custodia pensadas para proteger al inversor minorista. Aun así, el capital no está protegido: el fondo sigue expuesto al riesgo de mercado."
      },
      {
        q: "Un fondo tiene 5 estrellas de Morningstar. ¿Cómo se interpreta?",
        o: ["Que garantiza buenos resultados en el futuro",
            "Que está en el 10% superior de su categoría según su rentabilidad ajustada por riesgo y comisiones en el pasado",
            "Que tiene el costo más bajo del mercado",
            "Que fue evaluado por un analista que visitó a la gestora"],
        a: 1,
        e: "El rating por estrellas es cuantitativo y relativo a la categoría: 5 estrellas es el 10% superior, 4 el 22,5% siguiente, 3 el 35% del medio. Mira el pasado (3, 5 y 10 años), así que se complementa con el análisis del gestor, la estrategia y el costo."
      }
    ]
  },
  m2: {
    num: "4", when: "Viernes 2/10 · 15:30 h", title: "Acciones",
    questions: [
      {
        q: "Si una empresa quiebra y se liquida, ¿en qué lugar de la prioridad de cobro están los accionistas ordinarios?",
        o: ["Primeros, porque son los dueños de la empresa",
            "Después de los bonistas senior, pero antes que los bonistas subordinados",
            "Últimos, después de todos los acreedores",
            "Cobran en igualdad de condiciones que los bonistas"],
        a: 2,
        e: "El accionista es dueño de la empresa, pero cobra último en una liquidación, después de todos los acreedores. Por eso las acciones son el escalón de mayor riesgo en la estructura de capital."
      },
      {
        q: "Un inversor quiere comprar en Wall Street acciones de Petrobras o de TSMC sin operar en Brasil ni en Taiwán. ¿Qué instrumento usaría?",
        o: ["Una acción preferida emitida por la propia empresa en EE.UU.",
            "Un ADR, un certificado emitido por un banco de EE.UU. que representa acciones de una empresa extranjera",
            "Un ETF sectorial de EE.UU.",
            "Un bono corporativo convertible"],
        a: 1,
        e: "Los ADR (American Depositary Receipts) representan acciones de empresas extranjeras y cotizan en EE.UU. en dólares. Algunos ejemplos son PBR, TSM, ASML e YPF."
      },
      {
        q: "Nike cotiza a US$36,05 y su BPA de los últimos 12 meses es US$2,10, lo que da un P/E de ~17,2x. Su promedio de los últimos 12 meses fue ~29,9x y sus competidores cotizan con múltiplos más bajos. ¿Qué conclusión es correcta?",
        o: ["Está barata en cualquier comparación, así que conviene comprar",
            "Está barata frente a su propia historia, pero cotiza con prima frente a sus pares: el P/E depende de contra qué se compare",
            "Un P/E de 17,2x significa que la acción va a subir 17,2%",
            "El P/E no sirve para empresas que pagan dividendos"],
        a: 1,
        e: "P/E = precio / BPA = 36,05 / 2,10 ≈ 17,2x, es decir, se paga 17 veces el beneficio anual. Está 42% por debajo de su promedio, pero con prima frente a sus pares (adidas, Lululemon, Deckers, On). Por eso la valuación siempre se mira contra la historia y contra los comparables."
      },
      {
        q: "Netflix superó el BPA estimado en su reporte del 2T26, pero la acción cayó más de 7% en la jornada siguiente. ¿Cuál es la explicación más probable?",
        o: ["El mercado reacciona solo a los ingresos pasados y los ingresos crecieron",
            "La guía para el trimestre siguiente quedó por debajo del consenso y el mercado ajustó sus expectativas",
            "Las acciones siempre bajan después de un reporte",
            "La empresa recompró acciones, lo que diluye a los accionistas"],
        a: 1,
        e: "El precio refleja expectativas. Si la guía (lo que la empresa prevé para adelante) decepciona, la acción puede caer aunque el trimestre haya salido en línea o por encima de lo esperado."
      },
      {
        q: "Costco cotiza históricamente con un P/E mucho más alto que Target. ¿Qué lo justifica?",
        o: ["Costco no tiene deuda y Target sí",
            "Su modelo de membresías genera ingresos recurrentes, con alta lealtad de clientes y márgenes estables",
            "Costco paga el dividendo más alto del sector",
            "Target cotiza en una bolsa con menos liquidez"],
        a: 1,
        e: "La recaudación por membresías es un ingreso recurrente y previsible, y la renovación es muy alta. El mercado paga una prima por esa calidad y estabilidad del negocio. Es la idea de Buffett: mejor una empresa extraordinaria a un precio justo."
      }
    ]
  },
  m5: {
    num: "5", when: "Viernes 2/10 · 16:30 h", title: "ETFs",
    questions: [
      {
        q: "¿Cuál de estas es una ventaja de un ETF frente a un fondo mutuo tradicional?",
        o: ["Reinvierte automáticamente los dividendos",
            "Se puede comprar y vender durante toda la rueda como una acción, con stop loss, e incluso tomar posiciones cortas",
            "No se pagan comisiones al bróker",
            "Permite al gestor sobreponderar sectores a discreción"],
        a: 1,
        e: "El ETF cotiza en bolsa: se opera en horario de mercado, admite órdenes como stop loss y en general tiene gastos operativos más bajos. Como contra, se pagan comisiones al bróker, y algunos ETF tienen poca liquidez."
      },
      {
        q: "Un ETF con réplica sintética obtiene el retorno del índice mediante un swap con un banco. ¿Qué riesgo adicional tiene?",
        o: ["Ninguno: es idéntico a la réplica física",
            "El riesgo de contraparte: si el banco quiebra, puede no pagar el retorno. Por eso importa si hay colateral",
            "El riesgo de que el índice suba demasiado",
            "El riesgo de que no pueda cotizar en bolsa"],
        a: 1,
        e: "En la réplica física el ETF tiene los activos. En la sintética depende de que la contraparte del swap cumpla. El colateral es lo que protege al inversor si la contraparte hace default."
      },
      {
        q: "¿Qué diferencia estructural tiene un ETN (Exchange Traded Note) frente a un ETF?",
        o: ["El ETN no cotiza en bolsa",
            "El ETN es deuda emitida por una entidad financiera, parecida a un producto estructurado, así que incorpora el riesgo crediticio del emisor",
            "El ETN solo replica materias primas",
            "El ETN tiene capital garantizado"],
        a: 1,
        e: "El ETN cotiza y replica un índice como un ETF, pero no es un fondo con activos segregados: es deuda (subordinada) del emisor, con vencimiento. Si el emisor quiebra, el inversor puede perder aunque el índice haya subido."
      },
      {
        q: "Un ETF UCITS muestra poco volumen operado en la pantalla de una bolsa europea. ¿Significa que es ilíquido?",
        o: ["Sí, el volumen en pantalla es toda su liquidez",
            "No necesariamente: un ETF es al menos tan líquido como sus activos subyacentes, y gran parte del volumen se opera OTC y en otras bolsas",
            "Sí, por eso los ETF UCITS no se recomiendan",
            "No, porque la gestora garantiza la recompra al precio de compra"],
        a: 1,
        e: "La liquidez de un ETF tiene varias capas: el mercado primario (creación y rescate), el secundario en varias bolsas y el OTC, que puede ser el 40–70% del total. Para medirla hay que sumar todos los lugares de negociación."
      },
      {
        q: "Hay dos ETF sobre el mismo índice para mantener a largo plazo. A tiene expense ratio de 0,07% y tracking difference de −0,40% anual; B tiene 0,12% y −0,15%. ¿Cuál es más barato en costo total?",
        o: ["A, porque tiene el expense ratio más bajo",
            "B, porque el costo real incluye los costos implícitos, como la diferencia de rendimiento frente al índice",
            "Cuestan lo mismo, porque replican el mismo índice",
            "No se puede comparar sin conocer el precio de la cuota"],
        a: 1,
        e: "El costo total (Total Cost of Ownership) suma los costos explícitos (expense ratio, comisiones) y los implícitos (spread, tracking difference, impuestos). B rinde 0,25 pp más por año frente al índice, más que la diferencia de expense ratio."
      }
    ]
  },
  m6: {
    num: "6", when: "Sábado 3/10 · 9:00 h", title: "Productos Estructurados",
    questions: [
      {
        q: "Una nota con capital protegido combina un bono cupón cero con una opción. Si las tasas de interés suben, ¿qué pasa con el armado de la nota?",
        o: ["El bono cupón cero sale más caro y queda menos dinero para la opción",
            "El bono cupón cero sale más barato y queda más dinero para la opción, lo que permite mejores condiciones",
            "No cambia nada, porque la protección siempre es del 100%",
            "La opción deja de ser necesaria"],
        a: 1,
        e: "Con una tasa mayor, hace falta menos dinero hoy para asegurar el 100% al vencimiento. Por ejemplo, 1.000.000 / 1,045 = 956.900 al 4,5%. El resto (43.100) queda disponible para comprar la opción."
      },
      {
        q: "La nota Marex 2026 vista en clase (worst-of sobre QQQ, IWM y S&P 500) tiene barrera de cupón al 80% y barrera europea de capital al 60%. Al vencimiento: S&P 500 +10%, QQQ −5% e IWM −30%. ¿Qué recibe el inversor?",
        o: ["100% del capital más el cupón, porque dos de los tres subyacentes están por encima del 80%",
            "100% del capital sin cupón, porque el peor (IWM) quedó entre la barrera de capital y la de cupón",
            "70% del capital, porque IWM cayó 30%",
            "110% del capital, por la suba del S&P 500"],
        a: 1,
        e: "En una worst-of solo cuenta el peor subyacente. IWM terminó en 70% de su nivel inicial: por debajo de la barrera de cupón (80%), así que no cobra cupón, pero por encima de la de capital (60%), así que recupera el 100%. Si hubiera caído más de 40%, perdería uno a uno con la caída."
      },
      {
        q: "Una nota paga un cupón condicional con memoria del 2% trimestral. En el trimestre 1 se cobra; en el 2 el peor subyacente cierra debajo de la barrera de cupón; en el 3 vuelve a cerrar arriba. ¿Qué se cobra en el trimestre 3?",
        o: ["2%, el cupón del trimestre",
            "0%, porque el cupón del trimestre 2 anula los siguientes",
            "4%, el cupón del trimestre 3 más el que no se cobró en el trimestre 2",
            "6%, los tres cupones acumulados"],
        a: 2,
        e: "Con el efecto memoria, cuando se vuelve a cumplir la condición se pagan los cupones que no se cobraron antes. El del trimestre 1 ya se había cobrado, así que en el trimestre 3 se paga 2% + 2% = 4%."
      },
      {
        q: "En una nota autocall con nivel de autocall del 100%, en una fecha de observación todos los subyacentes cierran por encima de su nivel inicial. ¿Qué ocurre?",
        o: ["La nota se cancela en forma anticipada: el inversor recibe el 100% del capital más el cupón",
            "El inversor recibe las acciones del peor subyacente",
            "La nota sigue hasta el vencimiento, pero sin cupones",
            "La barrera de capital baja al 50%"],
        a: 0,
        e: "Al superar el nivel de autocall en una fecha de observación, la nota se cancela sola: se devuelve el 100% más el cupón del período. Por eso el plazo de una autocall no es fijo."
      },
      {
        q: "Incluso en una nota con capital 100% garantizado a vencimiento, ¿qué riesgo sigue teniendo el inversor?",
        o: ["Ninguno: la garantía es total",
            "El riesgo de crédito del emisor: si el banco emisor quiebra, la garantía puede no cumplirse",
            "Solamente el riesgo cambiario",
            "El riesgo de que el subyacente suba demasiado"],
        a: 1,
        e: "La nota es una deuda del emisor. La protección depende de que el emisor pueda pagar. Por eso importa su calidad crediticia, además de la iliquidez y el costo de salir antes del vencimiento."
      }
    ]
  },
  m8: {
    num: "7", when: "Sábado 3/10 · 10:30 h", title: "Portafolios de Inversión",
    questions: [
      {
        q: "¿Qué cliente encaja mejor en un perfil Conservador (80% renta fija, 10% renta variable, 10% alternativos)?",
        o: ["Alguien de 30 años que ahorra para su jubilación y tolera bien la volatilidad",
            "Alguien que necesita el dinero en dos años para comprar una vivienda y prioriza preservar el capital",
            "Un inversor que busca maximizar el crecimiento invirtiendo en empresas jóvenes",
            "Un fondo con horizonte de 20 años y sin necesidad de liquidez"],
        a: 1,
        e: "Un horizonte corto y una baja tolerancia al riesgo llevan a priorizar ingresos regulares y la preservación del capital. Eso es lo que ofrece una cartera con mayoría de renta fija."
      },
      {
        q: "¿Por qué conviene combinar en una cartera activos con baja correlación entre sí?",
        o: ["Porque aumenta el retorno esperado de cada activo",
            "Porque reduce la volatilidad total de la cartera sin tener que resignar retorno en la misma proporción",
            "Porque elimina por completo el riesgo de mercado",
            "Porque asegura que todos los activos suban al mismo tiempo"],
        a: 1,
        e: "Si los activos no se mueven juntos, las caídas de unos se compensan en parte con otros. Eso baja la volatilidad de la cartera. Es la base de la diversificación, aunque no elimina el riesgo sistémico."
      },
      {
        q: "Con una tasa libre de riesgo del 4%: la cartera A rinde 8% con volatilidad de 6%; la cartera B rinde 10% con volatilidad de 10%. Según el ratio de Sharpe, ¿cuál es más eficiente?",
        o: ["B, porque tiene el retorno más alto",
            "A, porque obtiene más exceso de retorno por unidad de riesgo (0,67 frente a 0,60)",
            "Son iguales, porque las dos superan a la tasa libre de riesgo",
            "B, porque su Sharpe es 1,0"],
        a: 1,
        e: "Sharpe = (retorno − tasa libre de riesgo) / volatilidad. A: (8 − 4) / 6 = 0,67. B: (10 − 4) / 10 = 0,60. A paga mejor cada unidad de riesgo que asume."
      },
      {
        q: "Un bono con cupón del 5% cotiza a un precio de 95 (bajo la par). ¿Cómo es su rendimiento al vencimiento (YTM) respecto del cupón?",
        o: ["Igual al cupón: 5%",
            "Menor que el cupón",
            "Mayor que el cupón, porque además del cupón se gana la diferencia entre 95 y 100 al vencimiento",
            "No se puede saber sin conocer la duración"],
        a: 2,
        e: "Si el precio es menor que 100, el YTM es mayor que el cupón. Si el precio es mayor que 100, el YTM es menor que el cupón. El rendimiento total es igual a los cupones más la variación de precio."
      },
      {
        q: "La porción de renta fija de una cartera tiene una duración de 4,2 años. Si las tasas suben 1 punto porcentual en forma pareja, ¿qué impacto aproximado cabe esperar en su precio?",
        o: ["Una suba de alrededor de 4,2%",
            "Una caída de alrededor de 4,2%",
            "Una caída de alrededor de 1%",
            "Ningún impacto, porque los bonos se mantienen hasta el vencimiento"],
        a: 1,
        e: "La duración mide la sensibilidad del precio a la tasa: variación % ≈ −duración × variación de la tasa, o sea −4,2 × 1% ≈ −4,2%. A mayor duración, mayor sensibilidad."
      }
    ]
  }
};

const LETTERS = ["A","B","C","D"];
const app = document.getElementById("app");
const prog = document.getElementById("prog"), progBar = document.getElementById("progBar");
const hdrTitle = document.getElementById("hdrTitle"), homeBtn = document.getElementById("homeBtn");
homeBtn.onclick = () => { location.hash = ""; };

const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem("cadiem_eval_"+k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem("cadiem_eval_"+k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let state = null;

function route(){
  const key = location.hash.replace("#","").toLowerCase();
  window.scrollTo(0,0);
  if (MODULES[key]) intro(key); else home();
}
window.addEventListener("hashchange", route);

function setHeader(title, showHome){
  hdrTitle.textContent = title;
  homeBtn.hidden = !showHome;
}
function setProgress(p){
  prog.hidden = p === null;
  if (p !== null) progBar.style.width = p + "%";
}

function home(){
  setHeader("Evaluaciones", false); setProgress(null);
  const items = Object.entries(MODULES).map(([k,m]) => {
    const r = store.get("res_"+k);
    return `<button class="mod" onclick="location.hash='${k}'">
      <span class="num">${m.num}</span>
      <span><span class="t">${esc(m.title)}</span><span class="s" style="display:block">${m.when} · ${m.questions.length} preguntas</span></span>
      ${r ? `<span class="done">${r.score}/${r.total}</span>` : ""}
    </button>`;
  }).join("");
  app.innerHTML = `<div class="fade">
    <div class="kicker">Certificación profesional en mercados financieros</div>
    <h1>Evaluaciones por tema</h1>
    <p class="lead">Elegí el tema que acabás de ver. Cada evaluación tiene 5 preguntas y ves la respuesta correcta al instante.</p>
    <div class="mods">${items}</div></div>`;
}

function intro(key){
  const m = MODULES[key];
  setHeader(m.title, true); setProgress(0);
  const name = store.get("name") || "";
  app.innerHTML = `<div class="fade">
    <div class="kicker">${m.when}</div>
    <h1>${esc(m.title)}</h1>
    <p class="lead">Evaluación de repaso sobre los contenidos del tema.</p>
    <div class="card" style="margin-top:18px">
      <div class="facts"><span><b>${m.questions.length}</b> preguntas</span><span><b>4</b> opciones cada una</span><span><b>~5</b> minutos</span></div>
      <div class="field"><label for="nm">Tu nombre y apellido</label>
      <input id="nm" autocomplete="name" placeholder="Ej.: María Pérez" value="${esc(name)}"></div>
      <button class="btn" id="go">Comenzar</button>
    </div></div>`;
  const nm = document.getElementById("nm"), go = document.getElementById("go");
  const check = () => go.disabled = nm.value.trim().length < 2;
  nm.addEventListener("input", check); check();
  nm.addEventListener("keydown", e => { if (e.key === "Enter" && !go.disabled) go.click(); });
  go.onclick = () => {
    store.set("name", nm.value.trim());
    state = { key, i: 0, answers: [], name: nm.value.trim() };
    question();
  };
}

function question(){
  const m = MODULES[state.key], q = m.questions[state.i];
  const correct = state.answers.filter((a,i) => a === m.questions[i].a).length;
  setProgress(state.i / m.questions.length * 100);
  let sel = null;
  const perm = q.o.map((_,k) => k);
  for (let k = perm.length - 1; k > 0; k--) { const r = Math.floor(Math.random() * (k + 1)); [perm[k], perm[r]] = [perm[r], perm[k]]; }
  app.innerHTML = `<div class="fade">
    <div class="qhead"><span class="qcount">Pregunta ${state.i+1} de ${m.questions.length}</span><span class="qscore">${correct} correcta${correct===1?"":"s"}</span></div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="opts">${perm.map((oi,j) => `<button class="opt" data-j="${oi}"><span class="L">${LETTERS[j]}</span><span>${esc(q.o[oi])}</span></button>`).join("")}</div>
    <div id="fbx"></div>
    <button class="btn" id="act" disabled>Confirmar respuesta</button></div>`;
  const opts = [...app.querySelectorAll(".opt")], act = document.getElementById("act");
  opts.forEach(b => b.onclick = () => {
    sel = +b.dataset.j;
    opts.forEach(x => x.classList.toggle("sel", x === b));
    act.disabled = false;
  });
  act.onclick = () => {
    if (act.dataset.done) { next(); return; }
    state.answers.push(sel);
    const ok = sel === q.a;
    opts.forEach(x => {
      const j = +x.dataset.j;
      x.disabled = true; x.classList.remove("sel");
      if (j === q.a) x.classList.add("right");
      else if (j === sel) x.classList.add("wrong");
    });
    document.getElementById("fbx").innerHTML = `<div class="fb ${ok?"ok":"no"} fade"><strong>${ok?"¡Correcto!":"Incorrecto · la respuesta correcta es la "+LETTERS[perm.indexOf(q.a)]}</strong>${esc(q.e)}</div>`;
    act.dataset.done = "1";
    act.textContent = state.i + 1 < m.questions.length ? "Siguiente pregunta" : "Ver resultado";
    setProgress((state.i+1) / m.questions.length * 100);
    act.scrollIntoView({behavior:"smooth", block:"nearest"});
  };
}

function next(){
  state.i++;
  window.scrollTo(0,0);
  if (state.i < MODULES[state.key].questions.length) question(); else result();
}

function result(){
  const m = MODULES[state.key];
  const total = m.questions.length;
  const score = state.answers.filter((a,i) => a === m.questions[i].a).length;
  const pct = Math.round(score / total * 100);
  const now = new Date();
  const when = now.toLocaleDateString("es-UY") + " " + now.toLocaleTimeString("es-UY", {hour:"2-digit", minute:"2-digit"});
  store.set("res_"+state.key, { score, total, when });
  setProgress(100);
  const msg = pct === 100 ? "¡Excelente! Respondiste todo bien."
            : pct >= 60 ? "Buen trabajo. Repasá las preguntas marcadas en rojo."
            : "Conviene repasar los conceptos del tema. Abajo tenés las explicaciones.";
  const review = m.questions.map((q,i) => {
    const ok = state.answers[i] === q.a;
    return `<div class="rv"><div class="h"><span class="dot ${ok?"ok":"no"}">${ok?"✓":"✕"}</span><span>${esc(q.q)}</span></div>
      <p>${ok ? "" : `Tu respuesta: ${esc(q.o[state.answers[i]])}<br>`}<b>Correcta: ${esc(q.o[q.a])}</b></p></div>`;
  }).join("");
  app.innerHTML = `<div class="fade">
    <div class="kicker">Resultado · ${m.when}</div>
    <h1>${esc(m.title)}</h1>
    <div class="card">
      <div class="score"><div class="ring" style="--p:${pct}"><span>${score}/${total}</span></div>
      <div><h2>${pct}% correcto</h2><p class="lead" style="margin-top:4px">${msg}</p></div></div>
      <div class="stamp"><b>${esc(state.name)}</b> · ${when}</div>
    </div>
    <div class="review">${review}</div>
    <div class="row">
      <button class="btn ghost" id="again">Reintentar</button>
      <button class="btn" id="back">Otros temas</button>
    </div></div>`;
  document.getElementById("again").onclick = () => { state = { key: state.key, i: 0, answers: [], name: state.name }; window.scrollTo(0,0); question(); };
  document.getElementById("back").onclick = () => { location.hash = ""; };
}

route();
</script>
</body>
</html>
